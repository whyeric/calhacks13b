[project]
name = "hedge-desk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlmodel>=0.0.21",
  "httpx>=0.27",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
data = ["duckdb>=1.0", "pandas>=2.2", "numpy>=1.26", "pyarrow>=16", "statsmodels>=0.14"]
books = ["beancount>=3.0"]
dev = ["pytest>=8", "pytest-socket>=0.7", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost"
