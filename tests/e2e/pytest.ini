[pytest]
# Own rootdir, so backend/pyproject.toml's pytest-socket addopts don't apply: conftest.py blocks
# sockets itself and records every attempt. No cache dir is written into the tree.
addopts = -p no:cacheprovider -p no:randomly
markers =
    slow: boots `make demo` in a copied tree (C8-A1, A3)
filterwarnings =
    ignore::DeprecationWarning
