<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offset Product Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --deep: #143c2a; --night: #0f1a14; --paper: #f3f5ef; --surface: #fffefa;
    --ink: #233b30; --muted-d: #a4ada4; --muted: #52645a; --primary: #20583f;
    --orange: #F28C28; --pos: #247153; --neg: #aa5037; --neg-t: #852f22;
    --warn: #b47a1d; --warn-bg: #faf0d9; --warn-t: #684611;
    --sim: #3e3170; --sim-bg: #e8e4f4; --border: #d7dfd1;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --serif: "Source Serif 4", Georgia, serif;
    --sans: "IBM Plex Sans", Arial, Helvetica, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: var(--paper); font-family: var(--sans); }
  #viewport { position: fixed; inset: 0; display: grid; place-items: center; background: #000; }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: 0 0; overflow: hidden;
    background: linear-gradient(180deg, var(--deep), var(--night));
  }
  /* Each scene paints the backdrop so an incoming scene fully covers the outgoing one (true dissolve). */
  .scene { position: absolute; inset: 0; display: none; background: linear-gradient(180deg, var(--deep), var(--night)); }
  .scene.on { display: block; }
  .scene-in { position: absolute; inset: 0; }
  #openfade { position: absolute; inset: 0; background: #112b1f; z-index: 5; pointer-events: none; opacity: 0; }
  .abs { position: absolute; }
  .will { will-change: transform, opacity; }

  /* Captions */
  .cap { position: absolute; left: 210px; top: 856px; width: 1500px; font: 500 40px/52px var(--sans); letter-spacing: -0.005em; color: var(--paper); }
  .cap .w { display: inline-block; white-space: pre; }
  .cap em { font-style: normal; color: #fff; font-weight: 600; }
  .cap .num { font-variant-numeric: tabular-nums; }
  .cap.sub { top: 916px; font: 400 32px/44px var(--sans); color: var(--muted-d); }
  .cap.sub .num { color: var(--paper); }
  .hero { font: 600 96px/104px var(--serif); letter-spacing: -0.02em; }
  .section { font: 600 64px/72px var(--serif); letter-spacing: -0.015em; }
  .eyebrow { font: 600 22px/28px var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-d); }

  /* Screenshot window */
  .win { position: absolute; border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: var(--paper);
    box-shadow: 0 30px 80px rgba(15,26,20,0.35), 0 4px 12px rgba(15,26,20,0.15); }
  .win .bar { height: 40px; flex: none; background: #e6ebe1; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--border); }
  .win .bar i { width: 12px; height: 12px; border-radius: 50%; background: #cdd7cb; display: block; }
  .win .bar .url { margin-left: 18px; font: 500 15px/1 var(--sans); color: var(--muted); }
  .win .chip { margin-left: auto; font: 600 22px/1 var(--sans); letter-spacing: 0.04em; padding: 5px 12px; border-radius: 999px; }
  .chip.warn { background: var(--warn-bg); color: var(--warn-t); }
  .chip.sim { background: var(--sim-bg); color: var(--sim); }
  .chip.real { background: #e2f0e7; color: #215637; }
  .win .vp { position: relative; overflow: hidden; }
  .win .cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .win .cam img, .win .cam .ph { position: absolute; left: 0; top: 0; display: block; }
  .ring, .dim { position: absolute; left: 0; top: 0; border-radius: 10px; pointer-events: none; opacity: 0; transform-origin: 50% 50%; will-change: transform, opacity; }
  .ring { border: 3px solid var(--orange); }
  .dim { box-shadow: 0 0 0 4000px rgba(15,26,20,0.45); }
  .ring.red { border-color: var(--neg); }
  .ring.amber { border-color: var(--warn); }
  .ring.green { border-color: var(--pos); }
  .ripple { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 3px solid var(--orange); opacity: 0; }

  /* Placeholder screenshot */
  .ph { background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  .ph .phbar { height: 6%; background: var(--surface); border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 1%; padding: 0 2%; font: 600 2.2cqw/1 var(--serif); }
  .ph .phbox { position: absolute; border: 2px dashed #b9c4b5; border-radius: 8px; background: rgba(255,254,250,0.8); color: var(--muted); font: 500 1.2cqw/1.2 var(--mono); padding: 0.6%; }
  .ph .phlabel { position: absolute; left: 4%; bottom: 5%; font: 500 1.6cqw/1.3 var(--mono); color: var(--muted); }

  /* Misc pieces */
  .pill { position: absolute; height: 76px; padding: 0 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    font: 500 32px/1 var(--sans); color: var(--muted-d); border: 2px solid rgba(243,245,239,0.25); background: rgba(243,245,239,0.04); }
  .pill .lit { position: absolute; inset: -2px; border-radius: 999px; background: var(--primary); border: 2px solid var(--orange); opacity: 0;
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; }
  .pill.owner .lit { background: var(--pos); border-color: #8fd1ad; }
  .stamp { position: absolute; font: 600 64px/1 var(--sans); letter-spacing: 0.14em; color: var(--neg); border: 6px solid var(--neg); border-radius: 12px;
    padding: 14px 28px; background: rgba(255,244,239,0.92); transform-origin: 50% 50%; }
  .bignum { position: absolute; font: 500 120px/120px var(--mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--paper); }
  .ticker { position: absolute; font: 500 40px/1 var(--mono); color: var(--paper); background: rgba(243,245,239,0.08); border: 1px solid rgba(243,245,239,0.22);
    padding: 16px 22px; border-radius: 10px; white-space: pre; }
  .ticker .caret { display: inline-block; width: 0.55em; height: 1em; background: var(--orange); vertical-align: -0.12em; margin-left: 2px; }
  .crop { position: absolute; overflow: hidden; border-radius: 12px; border: 1px solid var(--border); background: var(--paper);
    box-shadow: 0 18px 50px rgba(15,26,20,0.4); }
  .crop img, .crop .ph { position: absolute; left: 0; top: 0; }
  .tick { position: absolute; width: 56px; height: 56px; border-radius: 50%; background: var(--pos); display: grid; place-items: center; }
  .tag { position: absolute; font: 600 18px/1 var(--mono); padding: 6px 10px; border-radius: 6px; background: var(--orange); color: var(--night); }

  /* Controls */
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(15,26,20,0.55); z-index: 10; cursor: pointer; }
  #overlay button { display: flex; align-items: center; gap: 18px; font: 600 28px/1 var(--sans); color: var(--night); background: var(--paper);
    border: 0; border-radius: 999px; padding: 22px 40px 22px 30px; cursor: pointer; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  #overlay button svg { width: 34px; height: 34px; }
  #overlay > div { display: flex; flex-direction: column; align-items: center; padding: 0 16px; }
  #overlay .hint { margin-top: 18px; text-align: center; font: 400 16px/1.4 var(--sans); color: var(--muted-d); }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 16px 14px; display: flex; align-items: center; gap: 14px;
    background: linear-gradient(0deg, rgba(0,0,0,0.75), rgba(0,0,0,0)); transition: opacity 300ms var(--ease-out); }
  #controls.idle { opacity: 0; }
  #controls button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--paper); color: var(--night); cursor: pointer; display: grid; place-items: center; flex: none; }
  #controls button svg { width: 18px; height: 18px; }
  #track { position: relative; flex: 1; height: 28px; cursor: pointer; touch-action: none; }
  #track .rail { position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: rgba(243,245,239,0.25); }
  #track .fill { position: absolute; left: 0; top: 12px; height: 4px; border-radius: 2px; background: var(--orange); }
  #track .knob { position: absolute; top: 7px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--paper); }
  #track .mk { position: absolute; top: 8px; width: 2px; height: 12px; margin-left: -1px; background: rgba(243,245,239,0.55); }
  #track .mk span { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font: 600 11px/1 var(--sans); color: var(--muted-d); opacity: 0; transition: opacity 150ms; white-space: nowrap; }
  #track:hover .mk span { opacity: 1; }
  #time { font: 500 14px/1 var(--mono); color: var(--paper); font-variant-numeric: tabular-nums; flex: none; min-width: 108px; text-align: right; }
  #scene-name { font: 600 13px/1 var(--sans); color: var(--muted-d); flex: none; min-width: 36px; }
  body.record #controls, body.record #overlay { display: none !important; }
  @media (max-width: 600px) { #overlay .hint { display: none; } #time { min-width: 0; font-size: 12px; } #scene-name { display: none; } #controls { gap: 10px; } }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="overlay" hidden>
  <div>
    <button id="bigplay" aria-label="Play video"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>Play</button>
    <div class="hint">Space to play or pause. Arrow keys to skip.</div>
  </div>
</div>
<div id="controls">
  <button id="pp" aria-label="Play or pause"></button>
  <div id="scene-name"></div>
  <div id="track" aria-label="Scrubber"><div class="rail"></div><div class="fill"></div><div class="knob"></div></div>
  <div id="time">0:00 / 0:00</div>
</div>
<audio id="vo" preload="auto"></audio>
<script type="module" src="app.js"></script>
</body>
</html>
